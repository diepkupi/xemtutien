<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem Tu Tiên</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}
.header{
  padding:25px;
  text-align:center;
  background:rgba(0,0,0,0.4);
}
.header h2{
  color:#00eaff;
}
.container{
  max-width:1200px;
  margin:40px auto;
  padding:0 20px;
}
.video-card{
  background:rgba(0,0,0,0.6);
  border-radius:15px;
  padding:20px;
  margin-bottom:35px;
}
.video-title{
  font-size:20px;
  color:#ffd369;
  margin-bottom:10px;
}
iframe{
  width:100%;
  height:500px;
  border-radius:12px;
  border:none;
}
@media(max-width:768px){
  iframe{height:250px;}
}
</style>
</head>

<body>

<div class="header">
  <h2>⚔️ Xem Tu Tiên – Tự Động Nhớ Tiến Trình</h2>
</div>

<div class="container">

  <div class="video-card">
    <div class="video-title">📺 Tập 1 – Khởi đầu tu tiên</div>
    <iframe id="yt1" src="https://www.youtube.com/embed/Q17oXciDwPM?enablejsapi=1" allowfullscreen></iframe>
  </div>

  <div class="video-card">
    <div class="video-title">📺 Tập 2 – Thức tỉnh linh căn</div>
    <iframe id="yt2" src="https://www.youtube.com/embed/lPza6294n18?enablejsapi=1" allowfullscreen></iframe>
  </div>

  <div class="video-card">
    <div class="video-title">📺 Tập 3 – Bước vào tiên môn</div>
    <iframe id="yt3" src="https://www.youtube.com/embed/ZZNUmtAeSxs?enablejsapi=1" allowfullscreen></iframe>
  </div>

  <div class="video-card">
    <div class="video-title">📺 Tập 4 – Cao thủ xuất hiện</div>
    <iframe id="yt4" src="https://www.youtube.com/embed/EAUppvwFFIg?enablejsapi=1" allowfullscreen></iframe>
  </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let players = {};
let timers = {};
const ids = ['yt1','yt2','yt3','yt4'];

function onYouTubeIframeAPIReady(){
  ids.forEach(id=>{
    players[id] = new YT.Player(id,{
      events:{
        onReady:(e)=>{
          const saved = localStorage.getItem('progress_'+id);
          if(saved){
            setTimeout(()=>e.target.seekTo(+saved,true),1000);
          }
        },
        onStateChange:(e)=>{
          if(e.data === YT.PlayerState.PLAYING){
            if(!timers[id]){
              timers[id] = setInterval(()=>{
                localStorage.setItem(
                  'progress_'+id,
                  e.target.getCurrentTime()
                );
              },2000);
            }
          }else{
            clearInterval(timers[id]);
            timers[id] = null;
          }
        }
      }
    });
  });
}
</script>

</body>
</html>
